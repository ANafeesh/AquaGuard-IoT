name: Build iOS IPA (Free)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build iOS App (.ipa)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (Release, No Codesign)
        run: |
          flutter build ios --release --no-codesign 2>&1 | tee ios_build.log

      - name: Report failure in summary
        if: failure()
        run: |
          echo "### iOS Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 ios_build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Package into IPA
        run: |
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: Runner.app not found. Directory tree:"
            find build/ios -maxdepth 3
            exit 1
          fi
          mkdir -p build/ios/Payload
          cp -r "$APP_PATH" build/ios/Payload/
          cd build/ios
          zip -r AquaGuard.ipa Payload
          cd ../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AquaGuard-iOS-IPA
          path: build/ios/AquaGuard.ipa
          retention-days: 14
