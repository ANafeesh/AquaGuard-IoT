name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: |
          flutter build web --release --base-href "/AquaGuard-IoT/" 2>&1 | tee build_output.log

      - name: Report failure in summary
        if: failure()
        run: |
          echo "### Flutter Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 build_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          flutter analyze >> $GITHUB_STEP_SUMMARY 2>&1 || true

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web

      - name: Sync compiled build/web to main for Vercel
        run: |
          mkdir -p /tmp/vercel_build
          cp -r build/web/* /tmp/vercel_build/
          # Ensure root base href for Vercel
          sed -i 's|<base href="/AquaGuard-IoT/">|<base href="/">|g' /tmp/vercel_build/index.html
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          rm -rf build/web/*
          cp -r /tmp/vercel_build/* build/web/
          git add build/web
          if ! git diff --cached --quiet; then
            git commit -m "chore(deploy): sync compiled web build for Vercel [skip ci]"
            git push origin main
          fi
